{% extends "base.html" %}

{% block title %}
Editar Horario | ETFA
{% endblock %}

{% block page_title %}
Editar bloque académico
{% endblock %}

{% block page_description %}
Modificar una clase o actividad programada
{% endblock %}

{% block content %}

<style>

.form-panel {
    max-width: 900px;
    margin: auto;
    padding: 22px;
    background: white;
    border: 1px solid #e4e7ec;
    border-radius: 16px;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.form-group.full {
    grid-column: 1 / -1;
}

.form-group label {
    font-size: 11px;
    font-weight: 700;
    color: #344054;
}

.form-group input,
.form-group select {
    min-height: 42px;
    padding: 0 11px;
    border: 1px solid #d0d5dd;
    border-radius: 8px;
}

.form-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 20px;
}

.form-btn {
    min-height: 40px;
    padding: 0 16px;
    border-radius: 8px;
    border: none;
    text-decoration: none;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
}

.cancel {
    background: #f2f4f7;
    color: #344054;
}

.save {
    background: #2563eb;
    color: white;
}

</style>


<div class="form-panel">

    <form method="POST">

        <div class="form-grid">

            <div class="form-group">

                <label>
                    Fecha
                </label>

                <input
                    type="date"
                    name="fecha"
                    value="{{ horario.fecha }}"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Día
                </label>

                <select
                    name="dia_semana"
                    required
                >

                    {% for dia in [
                        'LUNES',
                        'MARTES',
                        'MIÉRCOLES',
                        'JUEVES',
                        'VIERNES',
                        'SÁBADO',
                        'DOMINGO'
                    ] %}

                    <option
                        value="{{ dia }}"
                        {% if horario.dia_semana == dia %}
                        selected
                        {% endif %}
                    >
                        {{ dia }}
                    </option>

                    {% endfor %}

                </select>

            </div>


            <div class="form-group">

                <label>
                    Inicio
                </label>

                <input
                    type="time"
                    name="hora_inicio"
                    value="{{ horario.hora_entrada_form }}"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Fin
                </label>

                <input
                    type="time"
                    name="hora_fin"
                    value="{{ horario.hora_salida_form }}"
                    required
                >

            </div>


            <div class="form-group full">

                <label>
                    Materia
                </label>

                <select
                    name="id_materia"
                    required
                >

                    {% for materia in materias %}

                    <option
                        value="{{ materia.id_materia }}"
                        {% if materia.id_materia == horario.id_materia %}
                        selected
                        {% endif %}
                    >
                        {% if materia.codigo %}
                            {{ materia.codigo }} -
                        {% endif %}

                        {{ materia.nombre }}
                    </option>

                    {% endfor %}

                </select>

            </div>


            <div class="form-group full">

                <label>
                    Docente
                </label>

                <input
                    type="text"
                    name="docente"
                    value="{{ horario.docente or '' }}"
                >

            </div>


            <div class="form-group">

                <label>
                    Lugar
                </label>

                <input
                    type="text"
                    name="lugar"
                    value="{{ horario.lugar or '' }}"
                >

            </div>


            <div class="form-group">

                <label>
                    Estado
                </label>

                <select name="estado">

                    {% for valor in [
                        'PROGRAMADA',
                        'EN_CURSO',
                        'FINALIZADA',
                        'CANCELADA'
                    ] %}

                    <option
                        value="{{ valor }}"
                        {% if horario.estado == valor %}
                        selected
                        {% endif %}
                    >
                        {{ valor }}
                    </option>

                    {% endfor %}

                </select>

            </div>

        </div>


        <div class="form-actions">

            <a
                href="{{ url_for('horarios') }}"
                class="form-btn cancel"
            >
                Cancelar
            </a>

            <button
                type="submit"
                class="form-btn save"
            >
                Guardar cambios
            </button>

        </div>

    </form>

</div>

{% endblock %}
