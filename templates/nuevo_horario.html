{% extends "base.html" %}

{% block title %}
Nuevo Bloque Académico | ETFA
{% endblock %}

{% block page_title %}
Nuevo bloque académico
{% endblock %}

{% block page_description %}
Agregar una clase o actividad al horario
{% endblock %}

{% block content %}

<style>

.form-panel {
    max-width: 900px;

    margin: auto;

    padding: 22px;

    background: white;

    border:
        1px solid #e4e7ec;

    border-radius: 16px;
}

.form-grid {
    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 15px;
}

.form-group {
    display: flex;

    flex-direction: column;

    gap: 6px;
}

.form-group.full {
    grid-column: 1 / -1;
}

.form-group label {
    color: #344054;

    font-size: 11px;

    font-weight: 700;
}

.form-group input,
.form-group select {
    min-height: 42px;

    padding: 0 11px;

    border:
        1px solid #d0d5dd;

    border-radius: 8px;

    outline: none;
}

.form-actions {
    margin-top: 20px;

    display: flex;

    justify-content: flex-end;

    gap: 8px;
}

.form-btn {
    min-height: 40px;

    padding: 0 16px;

    display: inline-flex;

    align-items: center;

    justify-content: center;

    border-radius: 8px;

    border: none;

    text-decoration: none;

    font-weight: 700;

    cursor: pointer;
}

.form-btn.cancel {
    background: #f2f4f7;
    color: #344054;
}

.form-btn.save {
    background: #2563eb;
    color: white;
}

</style>


<div class="form-panel">

    <form method="POST">

        <div class="form-grid">

            <div class="form-group">

                <label>
                    Fecha
                </label>

                <input
                    type="date"
                    name="fecha"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Día de la semana
                </label>

                <select
                    name="dia_semana"
                    required
                >
                    <option value="">Seleccione</option>
                    <option>LUNES</option>
                    <option>MARTES</option>
                    <option>MIÉRCOLES</option>
                    <option>JUEVES</option>
                    <option>VIERNES</option>
                    <option>SÁBADO</option>
                    <option>DOMINGO</option>
                </select>

            </div>


            <div class="form-group">

                <label>
                    Hora de inicio
                </label>

                <input
                    type="time"
                    name="hora_inicio"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Hora de finalización
                </label>

                <input
                    type="time"
                    name="hora_fin"
                    required
                >

            </div>


            <div class="form-group full">

                <label>
                    Materia / Actividad
                </label>

                <select
                    name="id_materia"
                    required
                >

                    <option value="">
                        Seleccione una materia
                    </option>

                    {% for materia in materias %}

                    <option value="{{ materia.id_materia }}">

                        {% if materia.codigo %}
                            {{ materia.codigo }} -
                        {% endif %}

                        {{ materia.nombre }}

                    </option>

                    {% endfor %}

                </select>

            </div>


            <div class="form-group full">

                <label>
                    Docente / Responsable
                </label>

                <input
                    type="text"
                    name="docente"
                    placeholder="Nombre del docente o Instructor de Guardia"
                >

            </div>


            <div class="form-group">

                <label>
                    Lugar
                </label>

                <input
                    type="text"
                    name="lugar"
                    placeholder="Aulas ETFA"
                >

            </div>


            <div class="form-group">

                <label>
                    N° de hora
                </label>

                <input
                    type="number"
                    name="numero_hora"
                    min="1"
                >

            </div>


            <div class="form-group">

                <label>
                    Curso
                </label>

                <input
                    type="text"
                    name="curso"
                    value="Primer Año Militar"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Paralelo
                </label>

                <input
                    type="text"
                    name="paralelo"
                    value="C"
                    required
                >

            </div>

        </div>


        <div class="form-actions">

            <a
                href="{{ url_for('horarios') }}"
                class="form-btn cancel"
            >
                Cancelar
            </a>

            <button
                type="submit"
                class="form-btn save"
            >
                Guardar bloque
            </button>

        </div>

    </form>

</div>

{% endblock %}
